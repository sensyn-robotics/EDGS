defaults:
  - train
  - _self_

# Ultra low memory configuration for EDGS
# Emergency settings when system freezes with other configs
# Absolute minimal settings while still using EDGS approach

# EDGS core with absolute minimal memory
train:
  no_densify: True  # Essential EDGS principle
  gs_epochs: 15000  # Further reduced iterations
  reduce_opacity: True  # Enable opacity reduction
  max_lr: True  # Use max learning rate for faster convergence

# Extreme memory reduction settings
gs:
  sh_degree: 0  # Minimal SH (only DC) for maximum memory savings
  opt:
    # Absolute minimal batch size
    batch_size: 1  # Ultimate reduction for RTX 4080 Laptop
    
    # Disable opacity reset completely
    opacity_reset_interval: 10_000_000  # Effectively disabled
    
    # Very conservative learning rates for tiny batches
    position_lr_init: 0.00008      # Very low for stability
    position_lr_final: 0.0000008   # Proportionally lower
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 15000
    
    # Minimal learning rates for stability
    feature_lr: 0.001     # Very conservative
    opacity_lr: 0.01      # Minimal opacity learning
    scaling_lr: 0.002     # Very reduced scaling
    rotation_lr: 0.0005   # Minimal rotation learning

# SfM-only initialization to avoid RoMa OOM  
init_wC:
  use: False  # Disable EDGS correlation initialization (avoids RoMa OOM)
  add_SfM_init: True  # Use SfM points for meaningful reconstruction
  matches_per_ref: 2000  # Very reduced matches to save memory
  num_refs: 30  # Very reduced refs to save memory