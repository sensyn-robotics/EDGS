defaults:
  - train
  - _self_

# Very low memory configuration for EDGS
# For GPUs with 4-6GB memory or very large/high-resolution scenes
# Minimal settings while maintaining EDGS effectiveness

# EDGS core with minimal memory usage
train:
  no_densify: True  # Essential EDGS principle
  gs_epochs: 20000  # Reduced iterations to save time and memory
  reduce_opacity: True  # Enable opacity reduction for cleanup
  max_lr: True  # Use max learning rate for faster convergence

# Aggressive memory reduction settings
gs:
  opt:
    # Minimal batch size for very low memory
    batch_size: 8  # Minimal batch size for 4-6GB systems
    
    # Disable opacity reset to save memory
    opacity_reset_interval: 10_000_000  # Effectively disabled
    
    # Conservative learning rates for stability with small batches
    position_lr_init: 0.00012      # Lower for stability
    position_lr_final: 0.0000012   # Proportionally lower
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 20000
    
    # Other learning rates reduced for small batch stability
    feature_lr: 0.002     # Reduced from standard
    opacity_lr: 0.02      # Conservative opacity learning
    scaling_lr: 0.004     # Reduced scaling learning
    rotation_lr: 0.001    # Conservative rotation learning

# Minimal initialization for severe memory constraints
init_wC:
  use: True  # Still use EDGS initialization - it's essential
  matches_per_ref: 10000  # Reduced matches for memory
  num_refs: 90           # Fewer reference images
  nns_per_ref: 2         # Minimal nearest neighbors
  scaling_factor: 0.001  # Larger initial scale to reduce gaussian count
  proj_err_tolerance: 0.01  # More lenient tolerance
  add_SfM_init: False    # Disable SfM to save memory