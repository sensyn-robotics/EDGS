defaults:
  - train
  - _self_

# HIGHEST QUALITY ⭐⭐⭐⭐⭐
# Target: A100 GPU (40-80GB VRAM)

train:
  no_densify: False
  gs_epochs: 150000
  reduce_opacity: True
  max_lr: True

gs:
  sh_degree: 3
  opt:
    iterations: 150000
    batch_size: 12

    # Densification
    densify_from_iter: 500
    densify_until_iter: 45000
    densify_grad_threshold: 0.0002
    percent_dense: 0.01
    densification_interval: 100

    opacity_reset_interval: 1000

    # Learning rates
    position_lr_init: 0.00032
    position_lr_final: 0.0000001
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 120000

    feature_lr: 0.0045
    opacity_lr: 0.09
    scaling_lr: 0.005
    rotation_lr: 0.002

    lambda_dssim: 0.4
    save_iterations: [30000, 60000, 90000, 120000, 150000]

init_wC:
  use: True
  add_SfM_init: True
  matches_per_ref: 20000
  num_refs: 240
  nns_per_ref: 5
  scaling_factor: 0.001
  proj_err_tolerance: 0.005
