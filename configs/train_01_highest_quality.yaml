defaults:
  - train
  - _self_

# HIGHEST QUALITY configuration for EDGS ⭐⭐⭐⭐⭐
# Optimized for NVIDIA A100 GPU maximum capability
# Extended training with best parameters for PSNR improvement

# EDGS core principle - no densification, rely on better initialization
train:
  no_densify: True  # CRITICAL: EDGS works WITHOUT densification
  gs_epochs: 150000  # Extended training for maximum quality
  reduce_opacity: True  # Enable opacity reduction for cleanup
  max_lr: True      # Use max learning rate schedule

# High-quality Gaussian Splatting optimization settings
gs:
  sh_degree: 3  # Maximum spherical harmonics degree for best quality
  opt:
    # Standard batch size to avoid memory issues
    batch_size: 1  # Standard size, prevents OOM and training instability
    
    # Opacity reset for removing low-contribution gaussians
    opacity_reset_interval: 5000  # Regular cleanup for quality
    
    # Fine-tuned learning rates for optimal convergence
    position_lr_init: 0.00016      # Conservative start for stability
    position_lr_final: 0.00000016   # Very low final for fine details
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 120000   # Extended schedule for 150k iterations
    
    # Carefully tuned learning rates
    feature_lr: 0.0025     # Standard rate for features
    opacity_lr: 0.05       # Moderate opacity learning
    scaling_lr: 0.003      # Conservative scaling updates
    rotation_lr: 0.001     # Standard rotation learning
    
    # Loss weighting for better structural quality
    lambda_dssim: 0.4  # Increased SSIM weight for better structural similarity
    
    # Save checkpoints for evaluation
    save_iterations: [30000, 60000, 90000, 120000, 150000]
    
    # Exposure compensation for lighting variations
    exposure_lr_init: 0.01
    exposure_lr_final: 0.0001

# Maximum quality EDGS initialization
init_wC:
  use: True  # Enable EDGS correlation-based initialization
  matches_per_ref: 50000    # Maximum matches for A100 memory
  num_refs: 600            # Use more reference views for coverage
  nns_per_ref: 10          # More nearest neighbors for dense coverage
  scaling_factor: 0.0005   # Balanced initial gaussian size
  proj_err_tolerance: 0.002  # Very strict projection error for quality
  roma_model: "outdoors"   # Use appropriate model (change to "indoors" if needed)
  add_SfM_init: True       # Include SfM points for comprehensive initialization