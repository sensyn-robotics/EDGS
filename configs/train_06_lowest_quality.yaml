defaults:
  - train
  - _self_

# LOWEST QUALITY ⭐
# Target: 4-8GB GPUs, SfM-only init, minimal settings

train:
  no_densify: True
  gs_epochs: 30000
  reduce_opacity: True
  max_lr: True

gs:
  sh_degree: 0
  dataset:
    data_device: cpu
  opt:
    iterations: 30000
    batch_size: 1

    opacity_reset_interval: 10_000_000  # Effectively disabled

    # Learning rates
    position_lr_init: 0.00008
    position_lr_final: 0.000008
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 30000

    feature_lr: 0.001
    opacity_lr: 0.01
    scaling_lr: 0.001
    rotation_lr: 0.0005

    lambda_dssim: 0.3
    save_iterations: [7000, 15000, 30000]

init_wC:
  use: False
  add_SfM_init: True
