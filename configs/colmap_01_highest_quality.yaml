# COLMAP Configuration: 01 - Highest Quality
# Ultra high quality reconstruction beyond COLMAP defaults
# Best possible quality reconstruction, highest memory usage
# Recommended for: High-end GPUs (16GB+), when quality is paramount

# Optional: specify data type for matching strategy selection
# Options: 'video', 'individual', 'internet'
# If not specified, defaults to 'individual'
data_type: individual

# Optional: path to vocabulary tree for efficient matching on large datasets (>=200 images)
# Download from: https://demuc.de/colmap/
# Example: vocab_tree_flickr100K_words32K.bin
# vocab_tree_path: /path/to/vocab_tree_flickr100K_words32K.bin

# Video/Image preprocessing settings
preprocessing:
  target_fps: 3.0              # High frame extraction rate for videos
  max_image_size: -1           # Keep original resolution for highest quality

sift_extraction:
  # Enhanced settings for maximum quality
  max_num_features: 16384      # Double COLMAP default for maximum features
  max_image_size: 4096         # Higher than COLMAP default for ultra resolution
  first_octave: -1             # Include super-resolution features
  num_octaves: 5               # More octaves for better scale coverage
  octave_resolution: 3
  peak_threshold: 0.004        # Lower threshold = more features detected
  edge_threshold: 10
  estimate_affine_shape: false
  domain_size_pooling: false
  upright: false

sift_matching:
  # Strict matching for highest quality
  max_ratio: 0.75              # Stricter ratio test for better matches
  max_distance: 0.65           # Stricter distance for quality
  cross_check: true
  max_num_matches: 65536       # Allow many matches for dense reconstruction

pipeline:
  # Strict pipeline settings for quality
  min_num_matches: 20          # Higher than COLMAP default for robustness
  multiple_models: true
  max_num_models: 50
  max_model_overlap: 20
  min_model_size: 10
  extract_colors: true
  num_threads: -1              # Use all threads

mapper:
  init_min_num_inliers: 20     # Higher for robustness
  init_max_error: 3.0          # Stricter error tolerance
  init_min_tri_angle: 2.0
  abs_pose_min_num_inliers: 20
  abs_pose_max_error: 6.0      # Stricter than default
  abs_pose_min_inlier_ratio: 0.20  # Higher ratio required
  filter_max_reproj_error: 3.0  # Stricter filtering
  filter_min_tri_angle: 0.5