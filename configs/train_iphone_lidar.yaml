defaults:
  - train
  - _self_

# OPTIMAL QUALITY ⭐⭐⭐
# Target: 12-16GB GPUs

train:
  no_densify: True
  gs_epochs: 30000
  reduce_opacity: False  # Disable so early checkpoints have visible opacity
  max_lr: True

gs:
  sh_degree: 3
  dataset:
    data_device: cpu
  opt:
    iterations: 30000
    batch_size: 1

    # Densification
    densify_from_iter: 2000
    densify_until_iter: 25000
    densify_grad_threshold: 0.0005
    percent_dense: 0.003
    densification_interval: 500

    opacity_reset_interval: 10000  # Push late so early saves are viewable

    # Learning rates
    position_lr_init: 0.00024
    position_lr_final: 0.000001
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 80000

    feature_lr: 0.0035
    opacity_lr: 0.07
    scaling_lr: 0.004
    rotation_lr: 0.0015

    lambda_dssim: 0.4
    save_iterations: [500, 1500, 3000, 6000, 15000, 30000]

init_wC:
  use: True
  add_SfM_init: False  # Remove 15.5M SfM points — EDGS provides dense init
  matches_per_ref: 12000
  num_refs: 150
  nns_per_ref: 3
  scaling_factor: 0.001
  proj_err_tolerance: 0.01
