defaults:
  - train
  - _self_

# Balanced EDGS configuration for tower scenes
# Optimized for 12GB GPUs with better initialization

# EDGS core - no densification
train:
  no_densify: True  # EDGS principle
  gs_epochs: 60000  
  reduce_opacity: True
  max_lr: True

# Memory-optimized Gaussian Splatting settings
gs:
  opt:
    # Moderate batch size for memory efficiency
    batch_size: 16  # Balanced for memory
    
    # Opacity reset to clean up bad gaussians
    opacity_reset_interval: 5000  # Periodic cleanup
    
    # Optimized learning rates for EDGS
    position_lr_init: 0.00024      # Higher than default
    position_lr_final: 0.0000024   # Balanced final rate
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 30000
    
    # Other learning rates
    feature_lr: 0.0035    # Moderate increase
    opacity_lr: 0.07      # Balanced opacity learning
    scaling_lr: 0.003     # Moderate scaling learning
    rotation_lr: 0.0015   # Balanced rotation learning

# Better initialization within memory limits
init_wC:
  matches_per_ref: 15000    # Good coverage without OOM
  num_refs: 180            # Balanced reference views
  nns_per_ref: 5           # Good neighbor count
  scaling_factor: 0.0004   # Balanced initial scale
  proj_err_tolerance: 0.005  # Reasonable tolerance
  roma_model: "indoors"   # For drone footage
  add_SfM_init: True       # Include SfM points