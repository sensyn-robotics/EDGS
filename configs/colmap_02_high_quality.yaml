# COLMAP Configuration: 02 - High Quality
# High quality reconstruction with good memory efficiency
# Between highest quality (01) and optimal quality (03)
# Recommended for: GPUs with 12-16GB, excellent quality with reasonable speed

# Optional: specify data type for matching strategy selection
# Options: 'video', 'individual', 'internet'
# If not specified, defaults to 'individual'
data_type: individual

# Optional: path to vocabulary tree for efficient matching on large datasets (>=200 images)
# Download from: https://demuc.de/colmap/
# Example: vocab_tree_flickr100K_words32K.bin
# vocab_tree_path: /path/to/vocab_tree_flickr100K_words32K.bin

# Video/Image preprocessing settings
preprocessing:
  target_fps: 2.0              # Frame extraction rate between 01 (3.0) and 03 (1.0)
  max_image_size: 2560         # 2.5K resolution for high quality

sift_extraction:
  # Settings between 01 (ultra) and 03 (defaults)
  max_num_features: 12288      # Between 01 (16384) and 03 (8192)
  max_image_size: 3200         # Match COLMAP default
  first_octave: -1             # Include super-resolution features
  num_octaves: 4               # Standard octave range
  octave_resolution: 3
  peak_threshold: 0.005        # Between 01 (0.004) and 03 (0.0067)
  edge_threshold: 10
  estimate_affine_shape: false
  domain_size_pooling: false
  upright: false

sift_matching:
  # Settings between 01 (strict) and 03 (defaults)
  max_ratio: 0.78              # Between 01 (0.75) and 03 (0.8)
  max_distance: 0.68           # Between 01 (0.65) and 03 (0.7)
  cross_check: true
  max_num_matches: 49152       # Between 01 (65536) and 03 (32768)

pipeline:
  # Settings between 01 (strict) and 03 (defaults)
  min_num_matches: 18          # Between 01 (20) and 03 (15)
  multiple_models: true
  max_num_models: 50
  max_model_overlap: 20
  min_model_size: 10
  extract_colors: true
  num_threads: -1              # Use all threads

mapper:
  init_min_num_inliers: 18     # Between 01 (20) and 03 (15)
  init_max_error: 3.5          # Between 01 (3.0) and 03 (4.0)
  init_min_tri_angle: 2.0
  abs_pose_min_num_inliers: 18
  abs_pose_max_error: 7.0      # Between 01 (6.0) and 03 (8.0)
  abs_pose_min_inlier_ratio: 0.18  # Between 01 (0.20) and 03 (0.15)
  filter_max_reproj_error: 3.5  # Between 01 (3.0) and 03 (4.0)
  filter_min_tri_angle: 0.5