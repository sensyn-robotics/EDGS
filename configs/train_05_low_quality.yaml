defaults:
  - train
  - _self_

# LOW QUALITY configuration for EDGS ⭐⭐
# Memory-safe settings for 8-12GB GPUs with long training
# Conservative but extended training for acceptable quality

# EDGS core - disable densification to save memory
train:
  no_densify: False  # Enable limited densification for better quality
  gs_epochs: 80000   # Even more epochs for convergence with densification
  reduce_opacity: True  # Help clean up bad gaussians
  max_lr: True  # Use max learning rate for better convergence

# Memory-optimized Gaussian Splatting settings
gs:
  sh_degree: 1  # Keep at 1 for now, SH degree 2 + EDGS correlation too memory intensive
  opt:
    # Minimal batch size to avoid CUDA OOM
    batch_size: 1  # Extreme reduction for RTX 4080 Laptop constraints
    
    # Opacity reset for cleanup without too much memory overhead
    opacity_reset_interval: 5000  # More frequent cleanup for better quality
    
    # Optimized learning rates for EDGS convergence with longer training
    position_lr_init: 0.00024      # Increased for better convergence with EDGS
    position_lr_final: 0.0000002   # Very fine final adjustments
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 75000   # Extended for 80k iterations
    
    # Other learning rates optimized for EDGS
    feature_lr: 0.0035    # Moderate increase for better features
    opacity_lr: 0.07      # Balanced opacity learning
    scaling_lr: 0.003     # Moderate scaling learning
    rotation_lr: 0.0015   # Balanced rotation learning
    
    # Controlled densification for quality without memory explosion
    densify_from_iter: 10000        # Start densification later
    densify_until_iter: 40000       # Continue longer for better quality
    densify_grad_threshold: 0.0005  # Higher threshold = more selective
    percent_dense: 0.002            # Very conservative densification rate
    densification_interval: 500     # Less frequent to save memory
    
    # Save more checkpoints for monitoring long training
    save_iterations: [20000, 40000, 60000, 80000]
    
    # Increase SSIM weight for better structural quality
    lambda_dssim: 0.2  # Reset to default since we're enabling densification

# Disable EDGS correlation to avoid OOM on 12GB GPU
init_wC:
  use: False   # Disabled - EDGS correlation causes OOM on 12GB GPU
  add_SfM_init: True  # Use SfM points only
  matches_per_ref: 10000   
  num_refs: 180           
  nns_per_ref: 3          
  scaling_factor: 0.001   
  proj_err_tolerance: 0.01