defaults:
  - train
  - _self_

# MEDIUM QUALITY ⭐⭐⭐
# Target: 8-12GB GPUs

train:
  no_densify: False
  gs_epochs: 60000
  reduce_opacity: True
  max_lr: True

gs:
  sh_degree: 1
  dataset:
    data_device: cpu
  opt:
    iterations: 60000
    batch_size: 1

    # Densification - conservative
    densify_from_iter: 5000
    densify_until_iter: 15000
    densify_grad_threshold: 0.001
    percent_dense: 0.001
    densification_interval: 1000

    opacity_reset_interval: 5000

    # Learning rates
    position_lr_init: 0.00016
    position_lr_final: 0.0000016
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 50000

    feature_lr: 0.0025
    opacity_lr: 0.05
    scaling_lr: 0.003
    rotation_lr: 0.001

    lambda_dssim: 0.35
    save_iterations: [10000, 20000, 40000, 60000]

init_wC:
  use: True
  add_SfM_init: True
  matches_per_ref: 6000
  num_refs: 120
  nns_per_ref: 2
  scaling_factor: 0.001
  proj_err_tolerance: 0.02
