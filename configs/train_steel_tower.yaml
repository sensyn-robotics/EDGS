# Custom configuration for steel tower dataset - optimized for center tower quality
# Focused on achieving PSNR > 25 with minimal background Gaussians

defaults:
  - train
  - _self_


# Training parameters
train:
  no_densify: True  # EDGS method - no densification
  gs_epochs: 30000  # Training iterations
  reduce_opacity: True
  max_lr: True
  
# Gaussian Splatting optimization - focused on tower structure
gs:
  dataset:
    source_path: 'outputs/closeup_flight_275/video_scene'
    model_path: 'outputs/closeup_flight_275/edgs_run1'
    
  opt:
    # Small batch for quality
    batch_size: 8
    
    # Aggressive opacity reset for cleaner background
    opacity_reset_interval: 5000
    
    # Higher learning rates for faster convergence
    position_lr_init: 0.00032
    position_lr_final: 0.0000032
    position_lr_delay_mult: 0.01
    position_lr_max_steps: 30000
    
    feature_lr: 0.005
    opacity_lr: 0.1
    scaling_lr: 0.005
    rotation_lr: 0.002
    
    # Reduced density for fewer background Gaussians
    percent_dense: 0.001
    densify_grad_threshold: 0.0003

# EDGS initialization - optimized for tower
init_wC:
  use: True  # Enable EDGS correlation initialization
  matches_per_ref: 10000  # Fewer matches for faster processing
  num_refs: 100  # Moderate reference views
  nns_per_ref: 3
  scaling_factor: 0.0003  # Smaller Gaussians for fine details
  proj_err_tolerance: 0.003  # Tighter tolerance
  add_SfM_init: False